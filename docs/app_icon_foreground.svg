<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Requirement COLOR: Premium Metallic Gold Shader Palette (#E5B84B, #D8A03A, #F3D27A, #C88D22) -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3D27A"/>
      <stop offset="35%" stop-color="#E5B84B"/>
      <stop offset="70%" stop-color="#D8A03A"/>
      <stop offset="100%" stop-color="#C88D22"/>
    </linearGradient>

    <radialGradient id="beadShader" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF4C0"/>
      <stop offset="30%" stop-color="#F3D27A"/>
      <stop offset="75%" stop-color="#E5B84B"/>
      <stop offset="100%" stop-color="#B87D18"/>
    </radialGradient>
  </defs>

  <!-- 
    Android Adaptive Icon Foreground Layer (Transparent Background)
    Artwork occupies ~74% of the 1024x1024 canvas to ensure safe-zone padding.
  -->
  <g id="adaptive_icon_foreground" transform="translate(0, -10)">
    
    <!-- 1. CRESCENT: Thicker, smoother metallic gold crescent moon -->
    <path fill="url(#goldGradient)" d="M 445 275 A 160 160 0 1 0 605 435 A 130 130 0 1 1 445 275 Z" />

