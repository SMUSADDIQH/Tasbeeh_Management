<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient (#003B2F to #00281F) -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#003B2F"/>
      <stop offset="70%" stop-color="#00281F"/>
      <stop offset="100%" stop-color="#001A14"/>
    </radialGradient>

    <!-- Metallic Gold Shaders -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D07A"/>
      <stop offset="45%" stop-color="#E4B54C"/>
      <stop offset="85%" stop-color="#D6A53C"/>
      <stop offset="100%" stop-color="#8A5A1B"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Requirement #4: Luxury Squircle Base & Gold Border (#D6A53C) -->
  <rect x="32" y="32" width="960" height="960" rx="210" ry="210" fill="url(#bgGrad)" stroke="#D6A53C" stroke-width="12" />

  <!-- 2. Requirement #8: Subtle Background Pattern (6% Opacity) -->
  <g opacity="0.06" stroke="#F2D07A" stroke-width="4">
    <path d="M 0,170 H 1024 M 0,512 H 1024 M 0,854 H 1024 M 170,0 V 1024 M 512,0 V 1024 M 854,0 V 1024 M 0,0 L 1024,1024 M 1024,0 L 0,1024" />
  </g>

