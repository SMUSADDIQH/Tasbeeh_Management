name: tasbeeh_tracker
description: "A premium, offline-first Zikr management and reflection app."
publish_to: "none"

version: 2.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^1.1.1
  in_app_review: ^2.0.11
  package_info_plus: ^9.0.0
  share_plus: ^12.0.1
  google_mlkit_translation: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/branding/tasbeeh_premium_icon.png
    - assets/branding/tasbeeh_premium_splash.png
    - assets/branding/android12_transparent_splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/tasbeeh_premium_icon.png
  image_path_android: assets/branding/tasbeeh_premium_icon.png
  image_path_ios: assets/branding/tasbeeh_premium_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#003B2F"

  android: true
  ios: true
  web: false
  fullscreen: true

  android_12:
    color: "#003B2F"
    image: assets/branding/android12_transparent_splash.png
